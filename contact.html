<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · SpotOnEasy</title>
<meta name="description" content="Contact SpotOnEasy support.">
<style>
  :root { --ink:#1f2933; --mute:#52606d; --line:#e4e7eb; --accent:#0f766e; --bg:#fbfaf7; --card:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
  main { max-width:620px; margin:0 auto; padding:56px 20px 40px; }
  h1 { font-size:1.8rem; margin:0 0 6px; }
  p { color:var(--mute); }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:18px; }
  label { display:block; font-weight:600; font-size:.92rem; margin:14px 0 6px; }
  label:first-of-type { margin-top:0; }
  input, textarea { width:100%; font:inherit; color:var(--ink); padding:10px 12px; border:1px solid #cbd2d9; border-radius:10px; background:#fff; }
  input:focus, textarea:focus { outline:2px solid #99f6e4; border-color:var(--accent); }
  textarea { min-height:150px; resize:vertical; }
  .captcha { margin-top:16px; }
  button { margin-top:16px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; padding:11px 22px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .status { margin-top:14px; font-weight:600; }
  .status.ok { color:#166534; }
  .status.err { color:#991b1b; }
  .hidden { display:none; }
  footer { border-top:1px solid var(--line); margin-top:48px; padding-top:16px; font-size:.9rem; color:var(--mute); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Contact SpotOnEasy</h1>
  <p>Questions about SpotOnEasy, Daylumaa SEO Tool or our privacy policy? Send a message and we'll reply by email, usually within two working days.</p>

  <form id="contact" action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="edbcde3b-8a67-4e59-9e4e-d13139365aaa">
    <input type="hidden" name="subject" value="New message from spotoneasy.com">
    <input type="hidden" name="from_name" value="SpotOnEasy website">
    <input type="checkbox" name="botcheck" class="hidden" style="display:none" tabindex="-1" autocomplete="off">

    <label for="name">Your name</label>
    <input id="name" name="name" type="text" required maxlength="100" autocomplete="name">

    <label for="email">Your email</label>
    <input id="email" name="email" type="email" required maxlength="150" autocomplete="email">

    <label for="message">Message</label>
    <textarea id="message" name="message" required maxlength="5000"></textarea>

    <div class="captcha h-captcha" data-captcha="true"></div>

    <button type="submit" id="send">Send message</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>

  <p style="margin-top:22px">You can also email <a href="mailto:support@spotoneasy.com">support@spotoneasy.com</a>.</p>

  <footer><a href="index.html">← SpotOnEasy home</a> · <a href="privacy.html">Privacy Policy</a> · © 2026 SpotOnEasy</footer>
</main>

<script src="https://web3forms.com/client/script.js" async defer></script>
<script>
  const form = document.getElementById('contact');
  const status = document.getElementById('status');
  const btn = document.getElementById('send');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = new FormData(form);
    const captcha = data.get('h-captcha-response');
    if (captcha !== null && !captcha) {
      status.className = 'status err';
      status.textContent = 'Please tick the "I am human" box first.';
      return;
    }
    btn.disabled = true;
    status.className = 'status';
    status.textContent = 'Sending…';
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: data
      });
      const json = await res.json();
      if (json.success) {
        form.reset();
        if (window.hcaptcha) { try { hcaptcha.reset(); } catch (_) {} }
        status.className = 'status ok';
        status.textContent = 'Thank you — your message has been sent. We will reply by email.';
      } else {
        status.className = 'status err';
        status.textContent = 'Sorry, the message was not sent: ' + (json.message || 'please try again.');
      }
    } catch (err) {
      status.className = 'status err';
      status.textContent = 'Sorry, the message could not be sent. Please email support@spotoneasy.com instead.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
